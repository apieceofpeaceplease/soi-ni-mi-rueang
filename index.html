<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ซอยนี้มีเรื่อง | Conflict ขอ Fix by a piece of peace, please</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai+Looped:wght@400;600;700&family=Mali:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E6EFEC;--card:#FFFFFF;--ink:#1F2A44;--mute:#5A6680;--trust:#2A9D8F;--tense:#E4572E;--fund:#E0A100;--line:#C9D8D3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201F;--card:#1D2D2B;--ink:#EAF2F0;--mute:#9DB2AD;--line:#2F4743;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14201F;--card:#1D2D2B;--ink:#EAF2F0;--mute:#9DB2AD;--line:#2F4743;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai Looped","Noto Sans Thai",system-ui,sans-serif;line-height:1.7;font-size:17px}
main{max-width:560px;margin:0 auto;padding:20px 18px 40px}
h1{font-size:30px;line-height:1.3;margin:8px 0 4px;font-weight:700}
h2{font-size:21px;line-height:1.4;margin:0 0 8px}
p{margin:0 0 12px}
.mute{color:var(--mute);font-size:15px}
.meters{display:grid;gap:8px;margin:14px 0 16px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.m{display:grid;grid-template-columns:104px 1fr 24px;align-items:center;gap:10px;font-size:14px}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;transition:width .5s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
button{font:inherit;color:inherit;text-align:left;width:100%;margin-top:10px;padding:13px 15px;border-radius:12px;border:2px solid var(--ink);background:transparent;cursor:pointer;min-height:48px}
button:hover{background:var(--ink);color:var(--bg)}
button:focus-visible{outline:3px solid var(--fund);outline-offset:2px}
button.go{background:var(--ink);color:var(--bg);text-align:center;font-weight:600}
.lesson{border-left:5px solid var(--trust);padding:4px 0 4px 12px;margin:14px 0}
.note{border-left:5px solid var(--fund);padding:4px 0 4px 12px;margin:14px 0;font-size:15px}
.tag{display:inline-block;font-size:14px;color:var(--mute);margin-bottom:6px}
details{margin-top:14px;font-size:14px;color:var(--mute)}
