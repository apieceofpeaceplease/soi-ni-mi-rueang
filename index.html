html,body{margin:0}

main{max-width:560px;margin:0 auto;padding:20px 18px 40px}

.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}

button:focus-visible{outline:3px solid var(--fund);outline-offset:2px}
button.go{background:var(--ink);color:var(--bg);text-align:center;font-weight:600}
.lesson{border-left:5px solid var(--trust);padding:4px 0 4px 12px;margin:14px 0}
.note{border-left:5px solid var(--fund);padding:4px 0 4px 12px;margin:14px 0;font-size:15px}
.tag{display:inline-block;font-size:14px;color:var(--mute);margin-bottom:6px}
details{margin-top:14px;font-size:14px;color:var(--mute)}
summary{cursor:pointer;font-weight:600}
li{margin-bottom:6px}
svg{display:block;margin:0 0 12px}
:root[data-theme="light"]{--bg:#FFE24A;--card:#fff;--ink:#111;--mute:#444;--trust:#00C16A;--tense:#FF3B30;--fund:#FFB800;--line:#111}

body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(rgba(0,0,0,.3) 1.4px,transparent 2px) 0 0/10px 10px}
main{position:relative;z-index:1;padding:14px}
#app{background:#fff;border:3px solid #111;border-radius:8px;padding:16px}
h1,h2,.tag,button,summary{font-family:"Mali","Noto Sans Thai Looped",system-ui,sans-serif}
.card,.meters{border:2px solid #111;box-shadow:4px 4px 0 #111}
.bar{height:14px;border:2px solid #111;background:#fff}
button{background:#fff;border:2px solid #111}
button.go{background:#FF4F9A;color:#111;box-shadow:3px 3px 0 #111}
button.go:hover{background:#111;color:#FFE24A}
.lesson{background:#E3FBEF;padding:8px 12px;border-left-color:#00C16A}
.note{background:#FFF3C4;padding:8px 12px;border-left-color:#FFB800}
html:root[data-theme]{--bg:#FFE24A;--card:#fff;--ink:#111;--mute:#444;--trust:#00C16A;--tense:#FF3B30;--fund:#FFB800;--line:#111;color-scheme:light}
body,#app{color:#111}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

var C=[[`ชวนร้านทำโพสต์ร่วมกัน คุณเล่าประสบการณ์ ร้านเล่าว่าแก้อะไรแล้ว และเชิญคุณกลับไปชิมใหม่`,`ลูกค้าเห็นว่าร้านรับฟัง ร้านได้ภาพลักษณ์ใหม่ คุณได้บริการที่ดีขึ้น`],[`เสนอให้ผู้เช่ารับงานดูแลอาคารหรือช่วยหาผู้เช่าใหม่ เพื่อหักเป็นค่าเช่า และเจ้าของลดค่าเช่าให้ช่วงที่ตกงาน`,`เจ้าของได้คนช่วยดูแลและไม่ต้องหาผู้เช่าใหม่ ผู้เช่ามีรายได้และที่อยู่`],[`ให้น้องใช้ที่ดินทำสวนหรือร้านเล็ก ๆ แบ่งรายได้ให้พี่ทุกปี และเก็บส่วนหนึ่งไว้เป็นพื้นที่ของครอบครัว`,`พี่ได้ส่วนแบ่งต่อเนื่อง น้องได้ดูแลที่ดินพ่อ ทุกคนยังมีที่กลับมา`],[`ตั้งตารางงานบ้านร่วมกัน สลับงานที่ไม่มีใครชอบ และเดือนละครั้งสั่งอาหารหรือจ้างช่วยแทน`,`ต่างฝ่ายได้เลือกงานที่ถนัด งานที่เกลียดแบ่งเท่ากัน และมีเวลาพักมากขึ้น`],[`ชวนเขาทำงานชุดต่อไปด้วยกัน ใส่ชื่อทีมทุกคน และเสนอให้ทุกประชุมมีช่วงให้เครดิตทีม`,`เครดิตเป็นธรรมกับทั้งทีม เพื่อนร่วมงานได้เรียนรู้ คุณมีพื้นที่แสดงผลงานจริง`],[`ตั้งคณะกรรมการร่วมของชุมชนและบริษัท ให้บุคคลที่สามตรวจสิ่งแวดล้อม รับคนท้องถิ่น และแบ่งรายได้ส่วนหนึ่งเข้ากองทุนชุมชน`,`ชุมชนมีส่วนกำกับและได้ประโยชน์ โครงการเดินหน้าด้วยความไว้ใจ`],[`ชวนลูกเขียนข้อตกลงครอบครัวด้วยกัน พ่อแม่วางมือถือเวลาเดียวกับลูก และมีวันที่ลูกได้เล่นยาวกว่าปกติ`,`ลูกรู้สึกถูกเคารพ พ่อแม่เห็นลูกนอนเร็วขึ้น ทั้งบ้านมีเวลาคุณภาพร่วมกัน`],[`เสนอให้ทีมมีธรรมเนียมให้ฟีดแบ็กแบบส่วนตัวก่อน และหัวหน้าขอโทษเรื่องวิธีการ โดยยังคุยเนื้องานต่อได้`,`หัวหน้ารักษามาตรฐานงานได้ ลูกน้องได้รับความเคารพ ทีมได้กติกาที่ดีขึ้น`],[`ชวนทั้งคู่ซ่อมกระเป๋าด้วยกัน คนทำเรียนเย็บ เจ้าของออกแบบลายปะ จนกลายเป็นกระเป๋าใบเดียวในโลก`,`เจ้าของได้กระเป๋าที่มีเรื่องราว คนทำได้รับผิดชอบด้วยตัวเอง ทั้งคู่สนิทกันมากขึ้น`],[`ชวนทุกคนเล่าความทรงจำปีใหม่ที่สำคัญของตัวเองก่อน แล้วนัดคุยเรื่องการเมืองอีกวันตอนใจเย็น พร้อมกติกาว่าฟังให้จบก่อนตอบ`,`โต๊ะผ่านไปอย่างอบอุ่น และเรื่องที่เห็นต่างมีพื้นที่ที่ปลอดภัยกว่าให้คุยกัน`]];D.forEach(function(q,i){q.c=C[i]});var E={w:[1,-2,1],l:[-2,2,-1],a:[-1,1,0],c:[3,-3,3]};

function start(){

else if(n.l>=n.a){t="คุณคือสายชนะ";d="คุณมุ่งมั่นและกล้าปกป้องสิ่งที่ต้องการ จุดแข็งคือตัดสินใจเร็ว สิ่งที่ลองฝึกต่อคือถามอีกฝ่ายก่อนว่าเขาต้องการอะไร เพราะการชนะฝ่ายเดียวมักทำให้ความสัมพันธ์เสียหาย"}
else{t="คุณคือสายหนี";d="คุณรักษาความสงบและไม่อยากให้ใครเจ็บ จุดแข็งคือไม่เติมเชื้อไฟ สิ่งที่ลองฝึกต่อคือกล้าพูดสิ่งที่ค้างในใจ เพราะเรื่องที่ไม่ถูกพูดมักกลับมาเสมอ"}
